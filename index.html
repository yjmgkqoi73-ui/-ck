<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#eee4d7">
  <title>CHARLES &amp; KEITH｜活動展示頁</title>
  <style>
    :root { --cream:#f5eee5; --ink:#191714; --gold:#b79a68; }
    * { box-sizing:border-box; }
    body { margin:0; color:var(--ink); background:var(--cream);
      font-family: "Noto Sans TC", "Microsoft JhengHei", Arial, sans-serif; }
    header { text-align:center; padding:34px 18px 22px; }
    .brand { font-family: Georgia, "Times New Roman", serif; font-size:clamp(25px,5vw,43px);
      letter-spacing:.16em; font-weight:500; }
    .sub { margin-top:12px; font-size:12px; letter-spacing:.3em; }
    .notice { max-width:760px; margin:0 auto 18px; padding:0 18px; text-align:center;
      font-size:13px; line-height:1.8; color:#665d52; }
    main { width:min(960px, 100%); margin:0 auto; padding:0 16px 42px; }
    .gallery { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
    .gallery img { display:block; width:100%; height:auto; border-radius:3px; }
    .cta-wrap { text-align:center; padding:32px 10px 12px; }
    .cta { display:inline-flex; align-items:center; justify-content:center; gap:14px;
      min-width:min(310px, 90vw); padding:17px 30px; border-radius:999px;
      background:linear-gradient(135deg,#24211d,#080807); color:#fffaf2;
      border:1px solid var(--gold); box-shadow:0 8px 22px #4b39251c;
      font-size:21px; letter-spacing:.12em; text-decoration:none; }
    .cta:hover { transform:translateY(-1px); }
    .hint { margin-top:14px; font-size:12px; letter-spacing:.08em; color:#5d554c; }
    footer { padding:12px 18px 28px; text-align:center; font-size:11px; line-height:1.7; color:#756b60; }
    @media (max-width:640px) { .gallery { grid-template-columns:1fr; gap:10px; } header {padding-top:26px;} }
  </style>
</head>
<body>
  <header>
    <div class="brand">CHARLES &amp; KEITH</div>
    <div class="sub">BAGS · SHOES · ACCESSORIES</div>
  </header>
  <p class="notice">精品風格活動展示頁｜點擊下方按鈕前往 LINE 連結</p>
  <main>
    <section class="gallery" aria-label="商品展示圖片">
      <img src="showcase-1.png" alt="小 CK 風格包款商品展示圖">
      <img src="showcase-2.png" alt="小 CK 風格精品陳列展示圖">
    </section>
    <div class="cta-wrap">
      <a class="cta" href="https://lin.ee/U3rcGZX" target="_blank" rel="noopener noreferrer">
        <span aria-hidden="true">LINE</span><span>點擊前往領取 →</span>
      </a>
      <div class="hint">點擊按鈕將開啟你提供的 LINE 連結</div>
    </div>
  </main>
  <footer>
    本頁為官方活動的展示頁，品牌官方網站或官方活動公告。<br>
    CHARLES &amp; KEITH 名稱及相關標識屬其各自權利人所有。
  </footer>
</body>
</html>
